name: Проверка цен

on:
  schedule:
    - cron: "*/30 * * * *"   # каждые 30 минут
  workflow_dispatch:
    inputs:
      digest:
        description: "Прислать сводку прямо сейчас"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить цены и отправить в Telegram
        env:
          TP_TOKEN: ${{ secrets.TP_TOKEN }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          FORCE_DIGEST: ${{ github.event_name == 'workflow_dispatch' && inputs.digest && '1' || '0' }}
        run: python bot.py

      - name: Запомнить, что уже присылали
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add -A state.json inbox
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase && git push)
